name: ai-review

# AI code review on every PR, including forks (pull_request_target exposes
# repo secrets to fork PRs). Safe: OpenCodeReview only reads the diff and
# never executes code from the PR.
#
# Secret to configure once: OCR_LLM_AUTH_TOKEN (OpenCode Go API key from
# https://opencode.ai/auth). Everything else is hardcoded below.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI review (OCR + glm-5.3-flash)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@v1.12.1
        with:
          llm_url: https://opencode.ai/zen/go/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: "false"
          # OpenCode Go requires a session header for routing/prompt caching
          # (https://opencode.ai/docs/go/#where-can-i-use-it)
          llm_extra_headers: >-
            {"x-opencode-session": "codesaber-ai-review-${{ github.event.pull_request.number }}",
             "User-Agent": "open-code-review/1.0"}
          background: >-
            CodeSaber is a lightweight, modular-monolith Wails v3 desktop IDE:
            Go backend (editor, git, terminal, LSP, ACP agents) + React 18 /
            CodeMirror 6 frontend + generated Wails bindings. Protect the
            architecture: each backend engine is an isolated goroutine with
            panic recovery and restart scaffolding; Wails-bound methods return
            fast (never block the UI); all persistence is atomic; dependencies
            are pure-Go / CGO-free; frontend bindings are generated, never
            hand-edited. Review thoroughly. Do not leave nit-level style
            comments — only report real defects: races, leaks, blocking calls,
            regressions in existing functionality, security issues, and broken
            tests. Findings in English.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sticky_summary: "true"
